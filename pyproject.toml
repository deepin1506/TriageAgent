[project]
name = "triage-agent"
version = "0.1.0"
description = "IT ticket triage agent: LangGraph + MCP + RAG over a mock ServiceNow Table API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "mcp>=2.3,<3",
    "langchain-google-genai>=4.4",
    "langchain-openai>=1.7",
]

[project.scripts]
mock-snow = "mock_snow.__main__:main"
triage = "triage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "anyio>=4.6",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_snow", "triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
