name: eval

# The LLM eval costs API calls, so it doesn't run on every push: only by hand, and on
# pushes to main that touch the agent, the knowledge base or the eval data.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["triage/agent/**", "triage/kb/**", "triage/llm.py", "kb/**", "evals/**"]

jobs:
  eval:
    runs-on: ubuntu-latest
    # ~20 min on a normal day (50 tickets, 4 s apart for free-tier rate limits); Gemini
    # overload retries can double it. Step timeouts below say WHICH step ran long.
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      - name: Skip when no API key is configured
        if: env.GEMINI_API_KEY == ''
        run: echo "::warning::Add the GEMINI_API_KEY secret and LLM_MODEL variable to run the eval"

      - uses: actions/checkout@v7
        if: env.GEMINI_API_KEY != ''
      - uses: astral-sh/setup-uv@v10.3.2
        if: env.GEMINI_API_KEY != ''
        with:
          enable-cache: true
      - name: Install
        if: env.GEMINI_API_KEY != ''
        run: uv sync --locked

      - name: Build the KB index (Gemini embeddings)
        if: env.GEMINI_API_KEY != ''
        timeout-minutes: 5
        run: uv run triage-kb build
      - name: Retrieval eval
        if: env.GEMINI_API_KEY != ''
        timeout-minutes: 5
        run: uv run triage-kb eval --min-hit-rate 0.9
      - name: Agent eval (fails below evals/thresholds.json)
        if: env.GEMINI_API_KEY != ''
        timeout-minutes: 35
        run: uv run triage-eval --sleep 4
      - name: Held-out eval (report only)
        if: always() && env.GEMINI_API_KEY != ''
        timeout-minutes: 12
        run: uv run triage-eval --cases evals/holdout.csv --out evals/results/holdout --no-gate --sleep 4

      - name: Report in the job summary
        if: always() && env.GEMINI_API_KEY != ''
        run: |
          cat evals/results/latest.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "## Held-out set" >> "$GITHUB_STEP_SUMMARY"
          cat evals/results/holdout/latest.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always() && env.GEMINI_API_KEY != ''
        with:
          name: eval-report
          path: evals/results/
